[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fate-and-fridge-backend"
version = "0.1.0"
description = "Fate & Fridge backend (Operation Dinner Plate)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/**" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# The repository lives on an SMB/9p share on the NAS; pytest's cache writer
# cannot create its temp files there. Disable the cache plugin to keep runs
# clean both locally and in CI.
addopts = "-ra -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
