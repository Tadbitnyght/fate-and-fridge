name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fatefridge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fatefridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fatefridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci-placeholder docker compose config -q

  stack:
    name: Docker stack acceptance
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/change-me-before-first-start/ci-test-password/' .env
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for a healthy application
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null; then
              echo "Application is healthy."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Application did not become healthy in time."
              docker compose logs
              exit 1
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/api/v1/health/db
      - name: Verify migrations were applied
        run: docker compose exec -T app alembic current
      - name: Stop stack
        if: always()
        run: docker compose down -v
