name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  backend:
    name: Backend (format, build, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Check EF Core model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/FateAndFridge.Api \
            --startup-project src/FateAndFridge.Api
      - name: Tests (unit + PostgreSQL integration via Testcontainers)
        run: dotnet test --configuration Release

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci-placeholder docker compose config -q

  stack:
    name: Docker stack acceptance + Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/change-me-before-first-start/ci-test-password/' .env
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for a healthy application
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null; then
              echo "Application is healthy."
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Application did not become healthy in time."
              docker compose logs
              exit 1
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/api/v1/health/db
      - name: Verify startup migrations ran
        run: docker compose logs app | grep -i "migrations applied"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e
      - name: Stop stack
        if: always()
        run: docker compose down -v
